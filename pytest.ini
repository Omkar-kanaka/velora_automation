[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short --html=reports/report.html --self-contained-html
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: Critical P0 smoke tests
    regression: Full functional & negative regression tests
    auth: Authentication & session management tests
    nav: Navigation & application shell tests
    projects: New project & context input tests
    projects_list: Projects list & project detail tests
    settings: Settings configuration & connectivity tests
    security: Security & access control checks
    ui: UI state & interactive component behavior tests
    tc(id): Links an automated test to a catalog test case ID
    bug(id): Links an automated test to a tracked defect / bug ID (e.g., VEL-025)
